<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doğum Günleri - Elexus VIP Servis</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <h1><i class="fas fa-crown"></i> VIP Servis</h1>
                <div class="guest-count">
                    <i class="fas fa-birthday-cake"></i>
                    <span id="totalBirthdayCount">0</span> Doğum Günü
                </div>
            </div>
            <div class="header-controls">
                <div class="search-container">
                    <input type="text" id="birthdaySearchInput" placeholder="Doğum günü ara...">
                    <button id="birthdaySearchBtn"><i class="fas fa-search"></i></button>
                </div>
                <button id="filterBirthdayBtn" class="filter-btn">
                    <i class="fas fa-filter"></i> Filtrele
                </button>
                <button id="addBirthdayBtn" class="add-btn">
                    <i class="fas fa-plus"></i> Doğum Günü Ekle
                </button>
                
                <!-- Ana Menü Dropdown -->
                <div class="main-menu-dropdown">
                    <button id="mainMenuBtn" class="main-menu-btn">
                        <i class="fas fa-bars"></i> Menü
                    </button>
                    <div class="dropdown-content">
                        <a href="index.html" class="menu-item" data-page="guests">
                            <i class="fas fa-users"></i> Misafirler
                        </a>
                        <a href="#" class="menu-item active" data-page="birthdays">
                            <i class="fas fa-birthday-cake"></i> Doğum Günleri
                        </a>
                        <a href="events.html" class="menu-item" data-page="events">
                            <i class="fas fa-music"></i> Konser & Etkinlikler
                        </a>
                    </div>
                </div>
                
                <button id="logoutBtn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Filter Panel -->
    <div id="birthdayFilterPanel" class="filter-panel hidden">
        <div class="filter-content">
            <h3>Doğum Günü Filtreleme</h3>
            <div class="filter-options">
                <label><input type="checkbox" value="thisMonth" checked> Bu Ay</label>
                <label><input type="checkbox" value="nextMonth"> Gelecek Ay</label>
                <label><input type="checkbox" value="pastMonth"> Geçen Ay</label>
                <label><input type="checkbox" value="all"> Tümü</label>
            </div>
            <button id="applyBirthdayFilter" class="apply-filter-btn">Uygula</button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <div id="birthdayList" class="guest-list">
            <!-- Birthday cards will be populated here -->
        </div>
    </main>

    <!-- Add Birthday Modal -->
    <div id="addBirthdayModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-birthday-cake"></i> Yeni Doğum Günü Ekle</h2>
                <button type="button" class="close-btn" onclick="window.vipService.closeAddBirthdayModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="addBirthdayForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="birthdayName">Misafir Adı *</label>
                        <input type="text" id="birthdayName" name="guest_name" required>
                    </div>
                    <div class="form-group">
                        <label for="birthdayDate">Doğum Günü *</label>
                        <input type="date" id="birthdayDate" name="birth_date" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="birthdayClass">VIP Sınıfı</label>
                        <select id="birthdayClass" name="vip_class">
                            <option value="">Seçiniz</option>
                            <option value="VIP">VIP</option>
                            <option value="A">A Grubu</option>
                            <option value="B">B Grubu</option>
                            <option value="C">C Grubu</option>
                            <option value="D">D Grubu</option>
                            <option value="Lokal">Lokal</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="birthdayPhoto">Fotoğraf</label>
                        <input type="file" id="birthdayPhoto" name="photo" accept="image/*">
                    </div>
                </div>
                <div class="form-group">
                    <label for="birthdayNotes">Notlar</label>
                    <textarea id="birthdayNotes" name="notes" rows="3" placeholder="Özel notlar, tercihler..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="cancel-btn" onclick="window.vipService.closeAddBirthdayModal()">İptal</button>
                    <button type="submit" class="submit-btn">Doğum Günü Ekle</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Birthday Modal -->
    <div id="editBirthdayModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-edit"></i> Doğum Günü Düzenle</h2>
                <button type="button" class="close-btn" onclick="window.vipService.closeEditBirthdayModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="editBirthdayForm">
                <input type="hidden" id="editBirthdayId" name="id">
                <div class="form-row">
                    <div class="form-group">
                        <label for="editBirthdayName">Misafir Adı *</label>
                        <input type="text" id="editBirthdayName" name="guest_name" required>
                    </div>
                    <div class="form-group">
                        <label for="editBirthdayDate">Doğum Günü *</label>
                        <input type="date" id="editBirthdayDate" name="birth_date" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="editBirthdayClass">VIP Sınıfı</label>
                        <select id="editBirthdayClass" name="vip_class">
                            <option value="">Seçiniz</option>
                            <option value="VIP">VIP</option>
                            <option value="A">A Grubu</option>
                            <option value="B">B Grubu</option>
                            <option value="C">C Grubu</option>
                            <option value="D">D Grubu</option>
                            <option value="Lokal">Lokal</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="editBirthdayPhoto">Fotoğraf</label>
                        <input type="file" id="editBirthdayPhoto" name="photo" accept="image/*">
                    </div>
                </div>
                <div class="form-group">
                    <label for="editBirthdayNotes">Notlar</label>
                    <textarea id="editBirthdayNotes" name="notes" rows="3" placeholder="Özel notlar, tercihler..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="cancel-btn" onclick="window.vipService.closeEditBirthdayModal()">İptal</button>
                    <button type="submit" class="submit-btn">Güncelle</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Doğum günü sayfası yüklendiğinde
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🎂 Doğum günü sayfası yükleniyor...');
            
            // VIP Service'in yüklenmesini bekle
            while (!window.vipService) {
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            
            // Sadece doğum günlerini yükle
            try {
                await window.vipService.loadBirthdays();
                console.log('✅ Doğum günleri yüklendi');
            } catch (error) {
                console.error('❌ Doğum günleri yükleme hatası:', error);
            }
            
            // Event listener'ları ekle
            const addBirthdayBtn = document.getElementById('addBirthdayBtn');
            const addBirthdayForm = document.getElementById('addBirthdayForm');
            const filterBirthdayBtn = document.getElementById('filterBirthdayBtn');
            const applyBirthdayFilter = document.getElementById('applyBirthdayFilter');
            
            if (addBirthdayBtn) {
                addBirthdayBtn.addEventListener('click', () => window.vipService.showAddBirthdayModal());
            }
            
            if (addBirthdayForm) {
                addBirthdayForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    console.log('🎂 Doğum günü formu gönderiliyor...');
                    
                    try {
                        // Form verilerini FormData'ya çevir
                        const formData = new FormData(addBirthdayForm);
                        
                        // Doğum günü ekle
                        await window.vipService.addBirthday(formData);
                        
                        // Formu temizle
                        addBirthdayForm.reset();
                        
                    } catch (error) {
                        console.error('Form gönderme hatası:', error);
                    }
                });
            }
            
            if (filterBirthdayBtn) {
                filterBirthdayBtn.addEventListener('click', () => {
                    const panel = document.getElementById('birthdayFilterPanel');
                    panel.classList.toggle('hidden');
                });
            }
            
            // Düzenleme formu submit handler'ı
            const editBirthdayForm = document.getElementById('editBirthdayForm');
            if (editBirthdayForm) {
                editBirthdayForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    console.log('🎂 Doğum günü düzenleme formu gönderiliyor...');
                    
                    try {
                        const formData = new FormData(editBirthdayForm);
                        const birthdayId = document.getElementById('editBirthdayId').value;
                        
                        await window.vipService.updateBirthday(birthdayId, formData);
                        window.vipService.closeEditBirthdayModal();
                        
                    } catch (error) {
                        console.error('Düzenleme hatası:', error);
                    }
                });
            }
        });
    </script>
</body>
</html>
