<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konser & Etkinlikler - Elexus VIP Servis</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <h1><i class="fas fa-crown"></i> VIP Servis</h1>
                <div class="guest-count">
                    <i class="fas fa-music"></i>
                    <span id="totalEventCount">0</span> Etkinlik
                </div>
            </div>
            <div class="header-controls">
                <div class="search-container">
                    <input type="text" id="eventSearchInput" placeholder="Etkinlik ara...">
                    <button id="eventSearchBtn"><i class="fas fa-search"></i></button>
                </div>
                <button id="filterEventBtn" class="filter-btn">
                    <i class="fas fa-filter"></i> Filtrele
                </button>
                <button id="addEventBtn" class="add-btn">
                    <i class="fas fa-plus"></i> Etkinlik Ekle
                </button>
                
                <!-- Ana Menü Dropdown -->
                <div class="main-menu-dropdown">
                    <button id="mainMenuBtn" class="main-menu-btn">
                        <i class="fas fa-bars"></i> Menü
                    </button>
                    <div class="dropdown-content">
                        <a href="index.html" class="menu-item" data-page="guests">
                            <i class="fas fa-users"></i> Misafirler
                        </a>
                        <a href="birthday.html" class="menu-item" data-page="birthdays">
                            <i class="fas fa-birthday-cake"></i> Doğum Günleri
                        </a>
                        <a href="#" class="menu-item active" data-page="events">
                            <i class="fas fa-music"></i> Konser & Etkinlikler
                        </a>
                    </div>
                </div>
                
                <!-- Kullanıcı Bilgileri -->
                <div class="user-info">
                    <i class="fas fa-user"></i>
                    <span id="eventUserName">Yiğit - VIP Servis</span>
                    <span class="user-role">admin</span>
                </div>
                
                <button id="logoutBtn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Filter Panel -->
    <div id="eventFilterPanel" class="filter-panel hidden">
        <div class="filter-content">
            <h3>Etkinlik Filtreleme</h3>
            <div class="filter-options">
                <label><input type="checkbox" value="concert" checked> Konser</label>
                <label><input type="checkbox" value="party"> Parti</label>
                <label><input type="checkbox" value="show"> Show</label>
                <label><input type="checkbox" value="other"> Diğer</label>
            </div>
            <button id="applyEventFilter" class="apply-filter-btn">Uygula</button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <div id="eventList" class="guest-list">
            <!-- Event cards will be populated here -->
        </div>
    </main>

    <!-- Add Event Modal -->
    <div id="addEventModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-music"></i> Yeni Etkinlik Ekle</h2>
                <button type="button" class="close-btn" onclick="window.vipService.closeAddEventModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="addEventForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="eventName">Etkinlik Adı *</label>
                        <input type="text" id="eventName" name="event_name" required>
                    </div>
                    <div class="form-group">
                        <label for="eventType">Etkinlik Türü *</label>
                        <select id="eventType" name="event_type" required>
                            <option value="">Seçiniz</option>
                            <option value="concert">Konser</option>
                            <option value="party">Parti</option>
                            <option value="show">Show</option>
                            <option value="other">Diğer</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="eventDate">Tarih *</label>
                        <input type="date" id="eventDate" name="event_date" required>
                    </div>
                    <div class="form-group">
                        <label for="eventTime">Saat</label>
                        <input type="time" id="eventTime" name="event_time">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="eventLocation">Yer *</label>
                        <input type="text" id="eventLocation" name="location" required>
                    </div>
                    <div class="form-group">
                        <label for="eventPhoto">Fotoğraf</label>
                        <input type="file" id="eventPhoto" name="photo" accept="image/*">
                    </div>
                </div>
                <div class="form-group">
                    <label for="eventDescription">Açıklama</label>
                    <textarea id="eventDescription" name="description" rows="3" placeholder="Etkinlik detayları..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="cancel-btn" onclick="window.vipService.closeAddEventModal()">İptal</button>
                    <button type="submit" class="submit-btn">Etkinlik Ekle</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Event Modal -->
    <div id="editEventModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-edit"></i> Etkinlik Düzenle</h2>
                <button type="button" class="close-btn" onclick="window.vipService.closeEditEventModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="editEventForm">
                <input type="hidden" id="editEventId" name="id">
                <div class="form-row">
                    <div class="form-group">
                        <label for="editEventName">Etkinlik Adı *</label>
                        <input type="text" id="editEventName" name="event_name" required>
                    </div>
                    <div class="form-group">
                        <label for="editEventType">Etkinlik Türü *</label>
                        <select id="editEventType" name="event_type" required>
                            <option value="">Seçiniz</option>
                            <option value="concert">Konser</option>
                            <option value="party">Parti</option>
                            <option value="show">Show</option>
                            <option value="other">Diğer</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="editEventDate">Tarih *</label>
                        <input type="date" id="editEventDate" name="event_date" required>
                    </div>
                    <div class="form-group">
                        <label for="editEventTime">Saat</label>
                        <input type="time" id="editEventTime" name="event_time">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="editEventLocation">Yer *</label>
                        <input type="text" id="editEventLocation" name="location" required>
                    </div>
                    <div class="form-group">
                        <label for="editEventPhoto">Fotoğraf</label>
                        <input type="file" id="editEventPhoto" name="photo" accept="image/*">
                    </div>
                </div>
                <div class="form-group">
                    <label for="editEventDescription">Açıklama</label>
                    <textarea id="editEventDescription" name="description" rows="3" placeholder="Etkinlik detayları..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="cancel-btn" onclick="window.vipService.closeEditEventModal()">İptal</button>
                    <button type="submit" class="submit-btn">Güncelle</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Etkinlik sayfası yüklendiğinde
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🎵 Etkinlik sayfası yükleniyor...');
            
            // VIP Service'in yüklenmesini bekle
            while (!window.vipService) {
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            
                    console.log('🎵 Etkinlikler sayfası yükleniyor...');
            
            // Etkinlikleri yükle
            try {
                await window.vipService.loadEvents();
                console.log('✅ Etkinlikler yüklendi');
            } catch (error) {
                console.error('❌ Etkinlikler yükleme hatası:', error);
            }
            
            // Event listener'ları ekle
            const addEventBtn = document.getElementById('addEventBtn');
            const addEventForm = document.getElementById('addEventForm');
            const filterEventBtn = document.getElementById('filterEventBtn');
            const applyEventFilter = document.getElementById('applyEventFilter');
            
            if (addEventBtn) {
                addEventBtn.addEventListener('click', () => window.vipService.showAddEventModal());
            }
            
            if (addEventForm) {
                addEventForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    console.log('🎵 Etkinlik formu gönderiliyor...');
                    
                    try {
                        // Form verilerini FormData'ya çevir
                        const formData = new FormData(addEventForm);
                        
                        // Etkinlik ekle
                        await window.vipService.addEvent(formData);
                        
                        // Formu temizle
                        addEventForm.reset();
                        
                    } catch (error) {
                        console.error('Form gönderme hatası:', error);
                    }
                });
            }
            
            if (filterEventBtn) {
                filterEventBtn.addEventListener('click', () => {
                    const panel = document.getElementById('eventFilterPanel');
                    panel.classList.toggle('hidden');
                });
            }
            
            // Düzenleme formu submit handler'ı
            const editEventForm = document.getElementById('editEventForm');
            if (editEventForm) {
                editEventForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    console.log('🎵 Etkinlik düzenleme formu gönderiliyor...');
                    
                    try {
                        const formData = new FormData(editEventForm);
                        const eventId = document.getElementById('editEventId').value;
                        
                        await window.vipService.updateEvent(eventId, formData);
                        window.vipService.closeEditEventModal();
                        
                    } catch (error) {
                        console.error('Düzenleme hatası:', error);
                    }
                });
            }
        });
    </script>
</body>
</html>
