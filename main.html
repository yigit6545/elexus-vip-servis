<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elexus VIP Servis - Ana Sayfa</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Ana Sayfa Container -->
    <div class="main-page-container">
        <!-- Login Modal -->
        <div id="loginModal" class="modal" style="display: block;">
            <div class="modal-content login-modal">
                <div class="modal-header">
                    <h2><i class="fas fa-crown"></i> VIP Servis Giriş</h2>
                </div>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Kullanıcı Adı</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Şifre</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="submit-btn">Giriş Yap</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Ana Menü (Login sonrası görünür) -->
        <div id="mainMenu" class="main-menu hidden">
            <div class="menu-header">
                <h1><i class="fas fa-crown"></i> VIP Servis</h1>
                <p>Hoş geldin, <span id="userName">Kullanıcı</span>!</p>
            </div>
            
            <div class="menu-grid">
                <div class="menu-item" data-page="guests">
                    <div class="menu-icon">
                        <i class="fas fa-users"></i>
                    </div>
                    <h3>Misafirler</h3>
                    <p>Misafir listesi ve yönetimi</p>
                </div>
                
                <div class="menu-item" data-page="birthdays">
                    <div class="menu-icon">
                        <i class="fas fa-birthday-cake"></i>
                    </div>
                    <h3>Doğum Günleri</h3>
                    <p>Doğum günü hatırlatmaları</p>
                </div>
                
                <div class="menu-item" data-page="events">
                    <div class="menu-icon">
                        <i class="fas fa-music"></i>
                    </div>
                    <h3>Konser & Etkinlikler</h3>
                    <p>Etkinlik yönetimi</p>
                </div>
            </div>
            
            <button id="logoutBtn" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i> Çıkış Yap
            </button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Ana sayfa yüklendiğinde
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🏠 Ana sayfa yükleniyor...');
            
            // VIP Service'in yüklenmesini bekle
            while (!window.vipService) {
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            
            // Authentication kontrolü
            const isAuthenticated = await window.vipService.checkAuthStatus();
            if (isAuthenticated) {
                console.log('✅ Kullanıcı giriş yapmış, ana menü gösteriliyor');
                showMainMenu();
            } else {
                console.log('⚠️ Kullanıcı giriş yapmamış, login ekranı gösteriliyor');
                showLoginModal();
            }
            
            // Login form submit handler
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    await handleLogin();
                });
            }
            
            // Logout button handler
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    window.vipService.logout();
                    showLoginModal();
                });
            }
            
            // Menu item click handlers
            const menuItems = document.querySelectorAll('.menu-item');
            menuItems.forEach(item => {
                item.addEventListener('click', () => {
                    const page = item.dataset.page;
                    navigateToPage(page);
                });
            });
        });
        
        // Login işlemi
        async function handleLogin() {
            try {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                
                await window.vipService.login(username, password);
                showMainMenu();
                
            } catch (error) {
                console.error('Login hatası:', error);
                alert('Giriş başarısız! Kullanıcı adı veya şifre hatalı.');
            }
        }
        
        // Ana menüyü göster
        function showMainMenu() {
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('mainMenu').classList.remove('hidden');
            
            // Kullanıcı adını güncelle
            const userName = document.getElementById('userName');
            if (window.vipService.currentUser) {
                userName.textContent = window.vipService.currentUser.fullName || window.vipService.currentUser.username;
            }
        }
        
        // Login modal'ı göster
        function showLoginModal() {
            document.getElementById('loginModal').style.display = 'block';
            document.getElementById('mainMenu').classList.add('hidden');
            
            // Form'u temizle
            document.getElementById('loginForm').reset();
        }
        
        // Sayfaya yönlendir
        function navigateToPage(page) {
            switch (page) {
                case 'guests':
                    window.location.href = 'index.html';
                    break;
                case 'birthdays':
                    window.location.href = 'birthday.html';
                    break;
                case 'events':
                    window.location.href = 'events.html';
                    break;
                default:
                    console.log('❓ Bilinmeyen sayfa:', page);
            }
        }
    </script>
</body>
</html>
